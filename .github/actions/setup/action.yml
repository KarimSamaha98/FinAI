name: Setup workspace
description: Node + pnpm, install dependencies, build shared-types so the apps typecheck.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm --filter shared-types run build
