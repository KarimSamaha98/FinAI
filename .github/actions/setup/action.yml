name: Setup workspace
description: Node + pnpm; optionally install dependencies and build shared-types so the apps typecheck.
inputs:
  install:
    description: Install dependencies and build shared-types ("false" leaves that to the agent, for fast answers)
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile && pnpm --filter shared-types run build
