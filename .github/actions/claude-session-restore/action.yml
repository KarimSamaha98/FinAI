name: Restore Claude session
description: >-
  Restores the newest saved Claude Code session for a branch from the Actions
  cache, so the next run continues the same conversation instead of starting
  cold. Outputs `resume_args` ("--resume <id>", or empty when there is none).
  Uses the cache, not artifacts: artifacts on a public repo are downloadable by anyone.
inputs:
  branch:
    description: Branch the session belongs to (e.g. agent/issue-12)
    required: true
outputs:
  resume_args:
    value: ${{ steps.read.outputs.resume_args }}
  session_id:
    value: ${{ steps.read.outputs.session_id }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: echo "prefix=claude-session-${BRANCH//\//-}-" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      with:
        path: ~/.claude/projects
        key: ${{ steps.key.outputs.prefix }}latest
        restore-keys: ${{ steps.key.outputs.prefix }}
    - id: read
      shell: bash
      run: |
        sid=$(cat ~/.claude/projects/.session-id 2>/dev/null || true)
        if [ -n "$sid" ] && find ~/.claude/projects -name "$sid.jsonl" | grep -q .; then
          echo "Resuming Claude session $sid" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "session_id=$sid" >> "$GITHUB_OUTPUT"
          echo "resume_args=--resume $sid" >> "$GITHUB_OUTPUT"
        else
          echo "No saved Claude session; starting a new one" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
