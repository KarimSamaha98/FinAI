# PR review assistant: the owner mentions @claude on a pull request.
#   - A question gets a short answer in a comment; no code changes.
#   - A change request updates the plan (and the issue if scope changed), then
#     implements it on the PR branch, re-runs checks and refreshes the PR body.
#
# Triggers: a PR conversation comment, or a submitted review whose summary
# mentions @claude. Batch line comments with "Start a review" and put @claude
# in the summary: one run handles the whole review.
#
# Each run resumes the Claude session saved for the PR's branch (the agent's own
# implementation session for agent/issue-N branches), so it answers with the
# context of how the code was written.
name: Claude PR assistant

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      review_id:
        description: Review to handle (set by the review trigger)
        required: false
        type: string

jobs:
  # Review events run in the PR's cache scope, where the branch's saved session
  # isn't visible. Re-dispatch them so every assistant run executes on main.
  route-review:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == github.repository_owner &&
      contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run claude-pr.yml -R "${{ github.repository }}" --ref main
          -f pr=${{ github.event.pull_request.number }}
          -f review_id=${{ github.event.review.id }}

  assist:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # One job per PR at a time; a new request waits for the current one.
      group: claude-pr-${{ inputs.pr || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node + pnpm only: dependencies are installed by Claude if it needs to
      # change code, so questions are answered without waiting for an install.
      - uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Check out the PR branch
        id: pr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          git switch -c "$branch" --track "origin/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          issue=""
          [[ "$branch" =~ ^agent/issue-([0-9]+)$ ]] && issue="${BASH_REMATCH[1]}"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          if [ -n "$issue" ] && gh issue view "$issue" --json labels --jq '.labels[].name' | grep -qx interactive; then
            echo "interactive=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand off to the interactive session
        if: steps.pr.outputs.interactive == 'true'
        run: >-
          gh pr comment "$PR" --body "Issue #${{ steps.pr.outputs.issue }} is in interactive mode on the Pi, so I'm leaving this
          request to that session (link in the issue). Remove the \`interactive\` label to hand it back to the cloud agents."

      - id: session
        if: steps.pr.outputs.interactive != 'true'
        uses: ./.github/actions/claude-session-restore
        with:
          branch: ${{ steps.pr.outputs.branch }}

      - id: claude
        if: steps.pr.outputs.interactive != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the owner's review assistant for PR #${{ env.PR }} on ${{ github.repository }},
            on its branch `${{ steps.pr.outputs.branch }}` (checked out). If this conversation
            has history, you wrote or last changed this PR: use that context.

            ## The owner's request
            ${{ inputs.review_id && format('A review (id {0}). Read its summary and every line comment: `gh api repos/{1}/pulls/{2}/reviews/{0}` and `gh api repos/{1}/pulls/{2}/reviews/{0}/comments`. Address all of them together.', inputs.review_id, github.repository, env.PR) || github.event.comment.body }}

            ## How to respond
            First decide: QUESTION or CHANGE REQUEST (a review can mix both).
            - QUESTION: answer directly and concisely. Lead with the answer, cite
              `file:line`, no code changes, no commits. Reply with
              `gh pr comment ${{ env.PR }} --body-file <file>`. Don't install dependencies.
            - CHANGE REQUEST:
              1. Dependencies are not installed: run
                 `pnpm install --frozen-lockfile && pnpm --filter shared-types run build`.
              2. If `docs/plans/issue-${{ steps.pr.outputs.issue || '<n>' }}.md` exists, add a dated
                 "Revisions" entry describing the requested change and update its steps.
                 If the change alters the issue's scope, edit the linked issue's body
                 (`gh issue edit`) and say what changed.
              3. Implement in focused commits, follow AGENTS.md invariants, `git push`.
              4. Run `pnpm typecheck && pnpm lint && pnpm test`; fix what you broke.
              5. Update the PR body (it follows `.github/claude/pr-template.md`) so every
                 section reflects the new state: `gh pr edit ${{ env.PR }} --body-file <file>`.
              6. Reply on the PR with what changed and the commit SHAs. For review line
                 comments, also reply in their threads
                 (`gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments/<id>/replies -f body=...`).
            If a request is ambiguous, pick the most reasonable reading, say which, and proceed.
          claude_args: |
            ${{ steps.session.outputs.resume_args }}
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep,TodoWrite,Bash(pnpm:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(mv:*),Bash(rm:*),Bash(node:*),Bash(date:*),Bash(wc:*),Bash(sed:*),Bash(diff:*)"

      - name: Save the Claude session for the next run
        if: always() && steps.pr.outputs.branch && steps.pr.outputs.interactive != 'true'
        uses: ./.github/actions/claude-session-save
        with:
          branch: ${{ steps.pr.outputs.branch }}
          session_id: ${{ steps.claude.outputs.session_id }}
